<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PropertyTrue">
  <defs>
    <linearGradient id="ptFill" x1="12" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9ec5ff"/>
      <stop offset="42%" stop-color="#2f6fed"/>
      <stop offset="100%" stop-color="#0f3ea8"/>
    </linearGradient>
    <radialGradient id="ptGlow" cx="32%" cy="26%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.2" stdDeviation="1.8" flood-color="#1340a8" flood-opacity="0.30"/>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="29.5" fill="url(#ptFill)" filter="url(#soft)"/>
  <circle cx="32" cy="32" r="29.5" fill="url(#ptGlow)"/>
  <circle cx="32" cy="32" r="25.2" fill="none" stroke="rgba(255,255,255,0.36)" stroke-width="1.2"/>

  <!-- clean modern PT monogram -->
  <g fill="#ffffff">
    <!-- P stem -->
    <rect x="17" y="17" width="5.4" height="30" rx="1.4"/>
    <!-- P bowl -->
    <path d="M22.4 17h9.6c6.7 0 11.2 3.7 11.2 9.2 0 5.55-4.5 9.25-11.2 9.25h-9.6V17zm5.4 5.05v8.35h4c3.2 0 5.15-1.6 5.15-4.15S35 22.05 31.8 22.05h-4z"/>
    <!-- T crossbar + stem, overlapping for lockup -->
    <rect x="33.6" y="17" width="15.2" height="5.2" rx="1.4"/>
    <rect x="38.7" y="17" width="5.2" height="30" rx="1.4"/>
  </g>
</svg>
