<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Property True T">
  <defs>
    <linearGradient id="plate" x1="10" y1="0" x2="54" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0c1b3a"/>
      <stop offset="100%" stop-color="#1d5fd6"/>
    </linearGradient>
    <linearGradient id="t" x1="32" y1="12" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <!-- dark blue plate -->
  <rect width="64" height="64" rx="16" fill="url(#plate)"/>

  <!-- bold capital T — two simple bars, no ornament -->
  <!-- crossbar -->
  <rect x="14" y="15" width="36" height="11" rx="2.5" fill="url(#t)"/>
  <!-- stem -->
  <rect x="25.5" y="15" width="13" height="34" rx="2.5" fill="url(#t)"/>
</svg>
