<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Property True T">
  <defs>
    <linearGradient id="plate" x1="8" y1="0" x2="56" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b1c3d"/>
      <stop offset="100%" stop-color="#1f5fd4"/>
    </linearGradient>
  </defs>

  <!-- jewel plate -->
  <rect width="64" height="64" rx="15" fill="url(#plate)"/>

  <!-- simple bold capital T -->
  <rect x="15" y="16" width="34" height="9" rx="1.5" fill="#ffffff"/>
  <rect x="27" y="16" width="10" height="32" rx="1.5" fill="#ffffff"/>
</svg>
