<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Property True T">
  <defs>
    <linearGradient id="plate" x1="8" y1="0" x2="56" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="48%" stop-color="#0b1c3d"/>
      <stop offset="100%" stop-color="#1f5fd4"/>
    </linearGradient>
    <linearGradient id="tFill" x1="32" y1="12" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8eefc"/>
    </linearGradient>
    <filter id="tSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.6" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- jewel plate -->
  <rect width="64" height="64" rx="15" fill="url(#plate)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.4" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!--
    Elegant capital T — Cormorant/editorial proportion:
    wide crossbar with refined serifs, slender stem with foot serifs.
  -->
  <g fill="url(#tFill)" filter="url(#tSoft)">
    <!-- top bar -->
    <path d="
      M14.2 18.2
      C14.2 16.5 15.4 15.2 17.1 15.2
      H46.9
      C48.6 15.2 49.8 16.5 49.8 18.2
      C49.8 19.1 49.4 19.9 48.7 20.4
      L46.6 21.9
      C45.9 22.4 45 22.7 44.1 22.7
      H19.9
      C19 22.7 18.1 22.4 17.4 21.9
      L15.3 20.4
      C14.6 19.9 14.2 19.1 14.2 18.2
      Z
    "/>
    <!-- stem -->
    <path d="
      M28.35 20.8
      H35.65
      V45.1
      C35.65 46.55 34.7 47.7 33.35 48.05
      L32 48.45
      L30.65 48.05
      C29.3 47.7 28.35 46.55 28.35 45.1
      Z
    "/>
    <!-- foot serifs -->
    <path d="
      M23.2 46.05
      C23.2 44.85 24.15 43.95 25.35 43.95
      H38.65
      C39.85 43.95 40.8 44.85 40.8 46.05
      C40.8 47.2 39.95 48.1 38.85 48.25
      L32.4 49.05
      C32.14 49.08 31.86 49.08 31.6 49.05
      L25.15 48.25
      C24.05 48.1 23.2 47.2 23.2 46.05
      Z
    "/>
  </g>
</svg>
