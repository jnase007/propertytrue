<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Deal Room — Property True</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="canonical" href="https://propertytrue.com/deals/" />
<link rel="icon" href="/assets/favicon.svg?v=t-simple-2" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#f4f6fa;
  --card:#ffffff;
  --ink:#1a2230;
  --muted:#667085;
  --line:#e6ebf2;
  --blue:#2f6fed;
  --blue-soft:#e8f0ff;
  --good:#0f9f6e;
  --good-bg:#e8faf3;
  --warn:#b78105;
  --warn-bg:#fff6de;
  --bad:#c23b3b;
  --bad-bg:#fdecec;
  --navy:#121826;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif}
a{color:var(--blue);text-decoration:none}
.hidden{display:none!important}

.top{
  position:sticky;top:0;z-index:20;
  display:flex;justify-content:space-between;align-items:center;
  padding:.85rem 1.1rem;background:rgba(244,246,250,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:.55rem;color:var(--ink);font-weight:800;letter-spacing:.04em;font-size:.8rem}
.brand img{width:28px;height:28px}
.top-link{border:1px solid var(--line);background:#fff;color:var(--muted);padding:.42rem .75rem;border-radius:999px;font-size:.82rem;font-weight:700}

.wrap{max-width:720px;margin:0 auto;padding:1.1rem 1rem 3rem}

/* PIN */
.gate{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;padding:1rem}
.box{
  width:min(420px,100%);text-align:center;background:#fff;
  border:1px solid var(--line);border-radius:24px;padding:1.5rem 1.2rem 1.35rem;
  box-shadow:0 18px 50px rgba(18,24,38,.06);
}
.kicker{color:var(--blue);font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.box h1{font-family:"Cormorant Garamond",serif;font-size:2.4rem;margin:.35rem 0 .4rem;color:var(--navy)}
.box p{color:var(--muted);margin:0 0 1rem;line-height:1.45;font-size:1.02rem}
.dots{display:flex;justify-content:center;gap:.7rem;margin:0 0 1.05rem}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #c9d3e3;background:transparent}
.dot.on{background:var(--blue);border-color:var(--blue)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem;max-width:300px;margin:0 auto}
.pad button{
  height:62px;border-radius:16px;border:1px solid var(--line);
  background:#f7f9fc;color:var(--ink);font-size:1.4rem;font-weight:800;cursor:pointer;
}
.pad button:active{background:var(--blue-soft)}
.pad .soft{font-size:.92rem;color:var(--muted)}
.err{min-height:1.2rem;color:var(--bad);margin-top:.7rem;font-weight:700}

/* Room */
.head h1{font-family:"Cormorant Garamond",serif;font-size:2.2rem;margin:0;color:var(--navy)}
.sub{color:var(--muted);margin:.2rem 0 1rem;font-size:.98rem;line-height:1.45}

.tabs{display:flex;gap:.5rem;overflow:auto;padding-bottom:.35rem;margin-bottom:1rem}
.tab{
  flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:999px;padding:.62rem .9rem;font-weight:800;font-size:.88rem;cursor:pointer;
}
.tab small{display:block;color:var(--muted);font-weight:600;font-size:.72rem;margin-top:.08rem}
.tab.active{background:var(--blue-soft);border-color:#c7daf8;color:var(--navy)}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;
  box-shadow:0 14px 40px rgba(18,24,38,.05);
}
.hero{
  aspect-ratio:16/10;background:linear-gradient(165deg,#e8eef8,#d9e3f2);
  display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700;position:relative;
}
.badge{
  position:absolute;left:.85rem;top:.85rem;border-radius:999px;padding:.35rem .7rem;
  font-size:.75rem;font-weight:800;border:1px solid transparent;
}
.badge.pass{background:var(--bad-bg);color:var(--bad)}
.badge.watch{background:var(--warn-bg);color:var(--warn)}
.badge.offer{background:var(--good-bg);color:var(--good)}
.body{padding:1.15rem 1.15rem 1.25rem}
.price{font-size:1.85rem;font-weight:800;margin:0;letter-spacing:-.02em;color:var(--navy)}
.addr{margin:.25rem 0 .75rem;font-size:1.08rem;line-height:1.35}
.addr small{color:var(--muted);font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.85rem}
.chip{border:1px solid var(--line);background:#f8fafc;border-radius:999px;padding:.3rem .65rem;font-size:.8rem;color:var(--muted);font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin:0 0 1rem}
.stat{background:#f7f9fc;border:1px solid var(--line);border-radius:14px;padding:.75rem}
.stat b{display:block;font-size:1rem;color:var(--navy);line-height:1.25}
.stat span{display:block;margin-top:.18rem;font-size:.74rem;color:var(--muted);font-weight:700}
.why{color:#4b5568;line-height:1.55;margin:0 0 1.05rem;font-size:1.02rem}
.acts{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:.5rem}
.acts button{border:0;border-radius:14px;padding:1rem .4rem;font-weight:800;font-size:1rem;cursor:pointer}
.btn-no{background:var(--bad-bg);color:var(--bad)}
.btn-maybe{background:var(--warn-bg);color:var(--warn)}
.btn-yes{background:var(--good-bg);color:var(--good)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.7rem}
.nav button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:.85rem;font-weight:800;cursor:pointer}
.listing{display:block;text-align:center;margin-top:.95rem;font-weight:800;font-size:1.02rem}

.stack{margin-top:1.25rem;background:#fff;border:1px solid var(--line);border-radius:20px;padding:1rem 1.05rem}
.stack h3{margin:0 0 .55rem;font-size:1.02rem;color:var(--navy)}
.stack section+section{margin-top:1rem}
.item{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line);font-size:.95rem}
.item:last-child{border-bottom:0}
.empty{color:var(--muted)}
.reset{width:100%;margin-top:1rem;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:.85rem;font-weight:800;cursor:pointer}

.site-footer{margin-top:2rem;background:#151b28;color:#b7c2d3;padding:2rem 1rem}
.site-footer .inner{max-width:720px;margin:0 auto}
.site-footer a{color:#cfe0ff}
</style>
</head>
<body>
<div class="top">
  <a class="brand" href="/"><img src="/assets/pt-mark.svg?v=t-simple-2" alt="" /> PROPERTY TRUE</a>
  <a class="top-link" href="/">Main site</a>
</div>

<div id="gate" class="gate">
  <div class="box">
    <div class="kicker">Private operator room</div>
    <h1>Deal Room</h1>
    <p>Tap the PIN with big buttons.<br>Then flip deals and mark interest.</p>
    <div class="dots"><div class="dot" id="d0"></div><div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div></div>
    <div class="pad" id="pad">
      <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
      <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
      <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
      <button type="button" class="soft" data-k="clear">Clear</button><button type="button" data-k="0">0</button><button type="button" class="soft" data-k="del">Delete</button>
    </div>
    <div class="err" id="err"></div>
  </div>
</div>

<main id="room" class="wrap hidden">
  <h1 class="head">Deal Room</h1>
  <p class="sub" id="prog">Review 2–4 deals. Tap Pass / Maybe / Interested.</p>
  <div class="tabs" id="tabs"></div>
  <div id="mount"></div>

  <div class="stack">
    <section><h3>Interested</h3><div id="yes"><div class="empty">Empty</div></div></section>
    <section><h3>Maybe</h3><div id="maybe"><div class="empty">Empty</div></div></section>
    <section><h3>Passed</h3><div id="no"><div class="empty">Empty</div></div></section>
    <button class="reset" type="button" id="resetBtn">Reset stack</button>
  </div>
</main>

<footer class="site-footer"><div class="inner">
  <div style="font-weight:800;letter-spacing:.12em;margin-bottom:.5rem;color:#eef3fb">PROPERTY TRUE</div>
  <div style="display:flex;flex-wrap:wrap;gap:.75rem 1rem;font-size:.9rem">
    <a href="/">Home</a>
    <a href="/truestorage-menifee.html">TrueStorage</a>
    <a href="/deals/">Deal Room</a>
    <a href="/access.html">Contact</a>
  </div>
</div></footer>

<script>
const PIN='3121';
let code='';
let idx=0;
const KEY='pt-deal-stack-v3';
const DEALS=[
  {id:'ev-001',address:'1234 S Everglade St',city:'Santa Ana, CA 92704',price:749900,beds:'3',baths:'2',sqft:'1,071',link:'https://www.redfin.com/CA/Santa-Ana/1234-S-Everglade-St-92704/home/4508341',verdict:'PASS',fast:'MAYBE',asis:'~$760K comps',rent:'~$3,030/mo',cf:'About -$2,400/mo',path:'Not winner at list',why:'Fair retail price. Practice only — not your first winner deal.'},
  {id:'blackwood-001',address:'2035 E Blackwood',city:'Anaheim, CA 92806',price:699999,beds:'3',baths:'2',sqft:'1,183',link:'https://www.redfin.com/CA/Anaheim/2035-E-Blackwood-Ln-92806/home/4004497',verdict:'WATCH',fast:'MAYBE',asis:'Needs comps',rent:'TBD',cf:'TBD',path:'Possible A/B',why:'Under $700K Anaheim 3/2. Fits your capital box. Worth a glance.'},
  {id:'pine-001',address:'112 E Pine St',city:'Santa Ana, CA 92701',price:699000,beds:'3',baths:'2',sqft:'757',link:'https://www.redfin.com/CA/Santa-Ana/112-E-Pine-St-92701',verdict:'WATCH',fast:'MAYBE',asis:'Needs comps',rent:'TBD',cf:'TBD',path:'Only if discounted',why:'Lower ask, tiny home. Only interesting if the discount is real.'},
  {id:'main-001',address:'725 S Main St',city:'Santa Ana, CA 92701',price:825000,beds:'mixed',baths:'retail + house',sqft:'1,842',link:'https://www.redfin.com/CA/Santa-Ana/725-S-Main-St-92701/home/145383963',verdict:'PASS',fast:'KILL',asis:'Rough / wide',rent:'Retail unknown',cf:'Likely negative',path:'Not first winner',why:'Retail rehab risk. Skip for first winner unless a huge discount later.'}
];

function $(id){return document.getElementById(id)}
function money(n){return '$'+Number(n).toLocaleString()}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{"yes":[],"no":[],"maybe":[]}')}catch(e){return{yes:[],no:[],maybe:[]}}}
function save(s){localStorage.setItem(KEY,JSON.stringify(s));paintStack()}
function paintDots(){for(let i=0;i<4;i++)$('d'+i).classList.toggle('on',i<code.length)}
function setErr(m){$('err').textContent=m||''}
function unlock(){
  sessionStorage.setItem('pt-ops','1');
  $('gate').classList.add('hidden');
  $('room').classList.remove('hidden');
  paintAll();
}
function tryPin(){
  if(code.length<4){setErr('Enter all 4 digits');return}
  if(code===PIN) unlock();
  else {setErr('Wrong PIN'); code=''; paintDots()}
}
function press(k){
  setErr('');
  if(k==='clear'){code='';paintDots();return}
  if(k==='del'){code=code.slice(0,-1);paintDots();return}
  if(code.length>=4) return;
  code += k; paintDots();
  if(code.length===4) setTimeout(tryPin,80);
}
$('pad').addEventListener('click',e=>{const b=e.target.closest('button[data-k]'); if(b) press(b.getAttribute('data-k'))});
window.addEventListener('keydown',e=>{
  if(!$('room').classList.contains('hidden')) return;
  if(e.key>='0'&&e.key<='9') press(e.key);
  if(e.key==='Backspace') press('del');
  if(e.key==='Escape') press('clear');
  if(e.key==='Enter') tryPin();
});

function badgeClass(v){
  v=(v||'').toUpperCase();
  if(v.includes('WATCH')||v.includes('MAYBE')) return 'watch';
  if(v.includes('OFFER')) return 'offer';
  return 'pass';
}
function paintTabs(){
  $('tabs').innerHTML = DEALS.map((d,i)=>`
    <button type="button" class="tab ${i===idx?'active':''}" data-i="${i}">
      ${i+1}. ${d.address.split(' ').slice(0,3).join(' ')}
      <small>${money(d.price)} · ${d.verdict}</small>
    </button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(btn=>{
    btn.onclick=()=>{ idx=Number(btn.getAttribute('data-i')); paintAll(); };
  });
}
function paintCard(){
  const d=DEALS[idx];
  $('prog').textContent = 'Deal '+(idx+1)+' of '+DEALS.length+' · use tabs or Next/Back';
  $('mount').innerHTML = `
  <article class="card">
    <div class="hero">
      <div class="badge ${badgeClass(d.verdict)}">${d.verdict}</div>
      <div>Open listing for photos</div>
    </div>
    <div class="body">
      <p class="price">${money(d.price)}</p>
      <div class="addr">${d.address}<br><small>${d.city}</small></div>
      <div class="chips">
        <span class="chip">${d.beds} bd · ${d.baths} ba · ${d.sqft} sf</span>
        <span class="chip">${d.fast}</span>
      </div>
      <div class="stats">
        <div class="stat"><b>${d.asis}</b><span>Comps / as-is</span></div>
        <div class="stat"><b>${d.rent}</b><span>Rent estimate</span></div>
        <div class="stat"><b>${d.cf}</b><span>Cash flow gut</span></div>
        <div class="stat"><b>${d.path}</b><span>Winner path</span></div>
      </div>
      <p class="why">${d.why}</p>
      <div class="acts">
        <button class="btn-no" type="button" data-v="no">Pass</button>
        <button class="btn-maybe" type="button" data-v="maybe">Maybe</button>
        <button class="btn-yes" type="button" data-v="yes">Interested</button>
      </div>
      <div class="nav">
        <button type="button" id="prev">← Previous</button>
        <button type="button" id="next">Next →</button>
      </div>
      <a class="listing" href="${d.link}" target="_blank" rel="noopener">Open full listing</a>
    </div>
  </article>`;
  $('mount').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>vote(b.getAttribute('data-v')));
  $('prev').onclick=()=>{ idx=(idx-1+DEALS.length)%DEALS.length; paintAll(); };
  $('next').onclick=()=>{ idx=(idx+1)%DEALS.length; paintAll(); };
}
function vote(kind){
  const d=DEALS[idx];
  const s=load();
  ['yes','no','maybe'].forEach(k=>{ s[k]=s[k].filter(x=>x.id!==d.id); });
  s[kind].unshift({id:d.id,address:d.address,price:d.price,link:d.link,verdict:d.verdict});
  save(s);
  idx=(idx+1)%DEALS.length;
  paintAll();
}
function paintStack(){
  const s=load();
  const paint=(k,el)=>{
    const a=s[k];
    el.innerHTML = a.length ? a.map(x=>`<div class="item"><div><b>${x.address}</b><div style="color:var(--muted)">${money(x.price)} · ${x.verdict}</div></div><a href="${x.link}" target="_blank" rel="noopener">View</a></div>`).join('') : '<div class="empty">Empty</div>';
  };
  paint('yes',$('yes')); paint('maybe',$('maybe')); paint('no',$('no'));
}
function paintAll(){ paintTabs(); paintCard(); paintStack(); }
$('resetBtn').onclick=()=>{ localStorage.removeItem(KEY); paintAll(); };

if(sessionStorage.getItem('pt-ops')==='1'){
  $('gate').classList.add('hidden');
  $('room').classList.remove('hidden');
  paintAll();
} else {
  paintDots();
}
</script>
</body>
</html>
