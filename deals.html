<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Deal Room</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" href="/assets/favicon.svg?v=t-simple-2" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#182033;--muted:#5b6577;--line:#d9e0ea;--blue:#2f6fed;--good:#0f9f6e;--warn:#a67c00;--bad:#c23b3b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif}
a{color:var(--blue)}.hidden{display:none!important}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:.55rem .85rem;background:rgba(238,242,247,.96);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:.75rem;letter-spacing:.05em;color:var(--ink);text-decoration:none;display:flex;gap:.4rem;align-items:center}.brand img{width:22px;height:22px}
.gate{min-height:calc(100dvh - 48px);display:flex;align-items:center;justify-content:center;padding:.75rem}
.box{width:min(360px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:1.1rem;text-align:center}
.box h1{margin:.25rem 0;font-size:1.5rem}.box p{color:var(--muted)}
.dots{display:flex;justify-content:center;gap:.55rem;margin:.7rem 0}.dot{width:12px;height:12px;border-radius:50%;border:2px solid #c5d0e0}.dot.on{background:var(--blue);border-color:var(--blue)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;max-width:260px;margin:0 auto}.pad button{height:52px;border-radius:12px;border:1px solid var(--line);background:#f7f9fc;font-size:1.2rem;font-weight:800}
.err{color:var(--bad);min-height:1rem;font-weight:700}
.room{max-width:560px;margin:0 auto;padding:.55rem .75rem 7rem}
.banner{background:#fff4d6;border:1px solid #f0d58a;border-radius:12px;padding:.65rem .75rem;margin-bottom:.65rem;font-size:.86rem;font-weight:700;color:#7a5a00}
.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:.45rem}.meta h1{margin:0;font-size:1.05rem}.meta span{color:var(--muted);font-size:.8rem;font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.hero{position:relative;height:150px;background:#d9e2ef}.hero img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:.55rem;top:.55rem;z-index:2;border-radius:999px;padding:.25rem .55rem;font-size:.7rem;font-weight:800;background:#fdecec;color:#c23b3b}
.body{padding:.7rem .75rem}.price{margin:0;font-size:1.4rem;font-weight:800}.addr{margin:.15rem 0 .45rem;font-weight:700}.addr small{display:block;color:var(--muted);font-size:.8rem}
.money{border:1px solid var(--line);border-radius:12px;background:#f7f9fc;padding:.65rem;margin:.5rem 0}.money h3{margin:0 0 .35rem;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.line{display:flex;justify-content:space-between;gap:.5rem;font-size:.84rem;font-weight:700;padding:.12rem 0}.line span{color:var(--muted);font-weight:600}
.cf{margin-top:.4rem;padding-top:.4rem;border-top:1px dashed var(--line);display:flex;justify-content:space-between;font-weight:800;color:var(--bad)}
.note,.why{font-size:.84rem;color:var(--muted);font-weight:600;line-height:1.35}
.stack{margin-top:.75rem;background:#fff;border:1px solid var(--line);border-radius:14px;padding:.7rem}.item{display:flex;justify-content:space-between;padding:.35rem 0;border-bottom:1px solid var(--line);font-size:.84rem}.empty{color:var(--muted)}
/* sticky actions always clickable */
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#fff;border-top:1px solid var(--line);padding:.6rem .75rem calc(.6rem + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.08)}
.sticky-inner{max-width:560px;margin:0 auto}
.acts{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:.4rem;margin-bottom:.4rem}
.acts button,.nav button,.nav a{
  appearance:none;-webkit-appearance:none;display:block;width:100%;
  border-radius:12px;padding:.9rem .3rem;font-weight:800;font-size:.95rem;
  text-align:center;cursor:pointer;user-select:none;touch-action:manipulation;
  position:relative;z-index:10000;pointer-events:auto;
}
.acts button{border:0}
.no{background:#fdecec;color:#c23b3b}.maybe{background:#fff4d6;color:#a67c00}.yes{background:#e7f8f1;color:#0f9f6e}
.nav{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:.35rem}
.nav button,.nav a{border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none}
</style>
</head>
<body>
<div class="top">
  <a class="brand" href="/"><img src="/assets/pt-mark.svg?v=t-simple-2" alt="" /> PROPERTY TRUE</a>
  <a class="toplink" href="/" style="color:var(--muted);font-weight:700;font-size:.78rem;text-decoration:none">Site</a>
</div>

<div id="gate" class="gate">
  <div class="box">
    <div style="color:var(--blue);font-size:.7rem;font-weight:800;letter-spacing:.12em">DEAL ROOM</div>
    <h1>Deal Room</h1>
    <p>Tap 3 1 2 1</p>
    <div class="dots"><div class="dot" id="d0"></div><div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div></div>
    <div class="pad" id="pad">
      <button type="button" onclick="press('1')">1</button>
      <button type="button" onclick="press('2')">2</button>
      <button type="button" onclick="press('3')">3</button>
      <button type="button" onclick="press('4')">4</button>
      <button type="button" onclick="press('5')">5</button>
      <button type="button" onclick="press('6')">6</button>
      <button type="button" onclick="press('7')">7</button>
      <button type="button" onclick="press('8')">8</button>
      <button type="button" onclick="press('9')">9</button>
      <button type="button" onclick="press('clear')">Clear</button>
      <button type="button" onclick="press('0')">0</button>
      <button type="button" onclick="press('del')">Del</button>
    </div>
    <div class="err" id="err"></div>
  </div>
</div>

<main id="room" class="room hidden">
  <div class="meta"><h1>Deal Room</h1><span id="prog">1 / 1</span></div>
  <div class="banner">Main St is destroyed — rehab is estimated, not bid. Buttons should work now.</div>
  <div id="mount"></div>
  <div class="stack">
    <div style="font-weight:800;margin-bottom:.35rem">Your stack</div>
    <div id="stackBody"><div class="empty">Empty</div></div>
    <button type="button" onclick="resetStack()" style="width:100%;margin-top:.5rem;border:1px solid var(--line);background:#fff;border-radius:10px;padding:.55rem;font-weight:800">Reset stack</button>
  </div>
</main>

<div id="sticky" class="sticky hidden">
  <div class="sticky-inner">
    <div class="acts">
      <button type="button" class="no" onclick="vote('no')">Pass</button>
      <button type="button" class="maybe" onclick="vote('maybe')">Maybe</button>
      <button type="button" class="yes" onclick="vote('yes')">Interested</button>
    </div>
    <div class="nav">
      <button type="button" onclick="prevDeal()">Prev</button>
      <button type="button" onclick="nextDeal()">Next</button>
      <a id="listing" href="#" target="_blank" rel="noopener">Listing</a>
    </div>
  </div>
</div>

<script>
const PIN = '3121';
let code = '';
let idx = 0;
const KEY = 'pt-deal-stack-v5';
const PLACEHOLDER = '/assets/deal-placeholder.svg';
const DEALS = [{
  id: 'main',
  address: '725 S Main St',
  city: 'Santa Ana, CA 92701',
  price: 825000,
  beds: '2 retail + house',
  sqft: '1,842',
  link: 'https://www.redfin.com/CA/Santa-Ana/725-S-Main-St-92701/home/145383963',
  photo: '',
  rent: 6500,
  rehab: 175000,
  rehab_note: 'Heavy / destroyed - estimate only until contractor bid',
  down: 165000,
  loan: 660000,
  pi: 4502,
  tax_ins_mo: 825,
  piti: 5327,
  buffer: 1300,
  cf: -127,
  carry_months: 6,
  rate: 7.25,
  verdict: 'PASS - NEEDS BID',
  why: 'Super destroyed. Rehab not optional. CF assumes finished/leased and is incomplete until rehab bid is real.'
}];

function money(n){
  if (n == null || isNaN(Number(n))) return '—';
  const x = Number(n);
  return (x < 0 ? '-' : '') + '$' + Math.round(Math.abs(x)).toLocaleString();
}
function loadStack(){
  try { return JSON.parse(localStorage.getItem(KEY) || '{"yes":[],"no":[],"maybe":[]}'); }
  catch (e) { return {yes:[], no:[], maybe:[]}; }
}
function saveStack(s){
  localStorage.setItem(KEY, JSON.stringify(s));
  paintStack();
}
function paintDots(){
  for (var i=0;i<4;i++) document.getElementById('d'+i).classList.toggle('on', i < code.length);
}
function setErr(m){ document.getElementById('err').textContent = m || ''; }
function unlock(){
  sessionStorage.setItem('pt-ops','1');
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('room').classList.remove('hidden');
  document.getElementById('sticky').classList.remove('hidden');
  paintAll();
}
function tryPin(){
  if (code.length < 4) { setErr('Need 4 digits'); return; }
  if (code === PIN) unlock();
  else { setErr('Wrong PIN'); code=''; paintDots(); }
}
function press(k){
  setErr('');
  if (k === 'clear') { code=''; paintDots(); return; }
  if (k === 'del') { code = code.slice(0,-1); paintDots(); return; }
  if (code.length >= 4) return;
  code = code + String(k);
  paintDots();
  if (code.length === 4) setTimeout(tryPin, 40);
}
function allInCash(d){
  return (d.down||0) + (d.rehab||0) + ((d.piti||0)*(d.carry_months||0));
}
function paintCard(){
  var d = DEALS[idx];
  document.getElementById('prog').textContent = (idx+1) + ' / ' + DEALS.length;
  var src = (d.photo && d.photo.trim()) ? d.photo : PLACEHOLDER;
  var cashIn = allInCash(d);
  document.getElementById('mount').innerHTML =
    '<article class="card">' +
      '<div class="hero">' +
        '<div class="badge">' + d.verdict + '</div>' +
        '<img src="' + src + '" alt="" onerror="this.onerror=null;this.src=\'' + PLACEHOLDER + '\';" />' +
      '</div>' +
      '<div class="body">' +
        '<p class="price">' + money(d.price) + '</p>' +
        '<div class="addr">' + d.address + '<small>' + d.city + ' · ' + d.beds + ' · ' + d.sqft + ' sf</small></div>' +
        '<div class="money">' +
          '<h3>Money wrap</h3>' +
          '<div class="line"><span>20% down</span><b>' + money(d.down) + '</b></div>' +
          '<div class="line"><span>Loan</span><b>' + money(d.loan) + '</b></div>' +
          '<div class="line"><span>P&I @ ' + d.rate + '%</span><b>' + money(d.pi) + '/mo</b></div>' +
          '<div class="line"><span>Tax+ins</span><b>' + money(d.tax_ins_mo) + '/mo</b></div>' +
          '<div class="line"><span>PITI</span><b>' + money(d.piti) + '/mo</b></div>' +
          '<div class="line"><span>Rehab estimate</span><b>' + money(d.rehab) + '</b></div>' +
          '<div class="line"><span>Carry while empty</span><b>' + money(d.piti * d.carry_months) + ' (' + d.carry_months + ' mo)</b></div>' +
          '<div class="line"><span>Cash in all-in rough</span><b>' + money(cashIn) + '</b></div>' +
          '<div class="line"><span>Rent if finished</span><b>' + money(d.rent) + '/mo</b></div>' +
          '<div class="line"><span>20% buffer</span><b>' + money(d.buffer) + '/mo</b></div>' +
          '<div class="cf"><span>CF if finished/leased</span><span>' + money(d.cf) + '/mo</span></div>' +
          '<div class="note">Rehab note: ' + d.rehab_note + '</div>' +
        '</div>' +
        '<p class="why">' + d.why + '</p>' +
      '</div>' +
    '</article>';
  document.getElementById('listing').href = d.link;
}
function paintStack(){
  var s = loadStack();
  function block(title, arr){
    var html = '<div style="font-weight:800;margin:.45rem 0 .2rem">' + title + '</div>';
    if (!arr.length) return html + '<div class="empty">Empty</div>';
    return html + arr.map(function(x){
      return '<div class="item"><div><b>' + x.address + '</b><div style="color:var(--muted)">' + money(x.price) + ' · ' + (x.kind||'') + '</div></div><a href="' + x.link + '" target="_blank" rel="noopener">View</a></div>';
    }).join('');
  }
  document.getElementById('stackBody').innerHTML =
    block('Interested', s.yes || []) +
    block('Maybe', s.maybe || []) +
    block('Passed', s.no || []);
}
function paintAll(){ paintCard(); paintStack(); }
function vote(kind){
  var d = DEALS[idx];
  var s = loadStack();
  ['yes','no','maybe'].forEach(function(k){
    s[k] = (s[k]||[]).filter(function(x){ return x.id !== d.id; });
  });
  s[kind].unshift({id:d.id, address:d.address, price:d.price, link:d.link, kind:kind});
  saveStack(s);
  // keep same deal visible after vote so feedback is obvious
  paintAll();
  var msg = kind === 'yes' ? 'Saved to Interested' : (kind === 'maybe' ? 'Saved to Maybe' : 'Saved to Passed');
  setTimeout(function(){ alert(msg); }, 10);
}
function prevDeal(){ idx = (idx - 1 + DEALS.length) % DEALS.length; paintAll(); }
function nextDeal(){ idx = (idx + 1) % DEALS.length; paintAll(); }
function resetStack(){ localStorage.removeItem(KEY); paintAll(); }

// expose for inline handlers
window.press = press;
window.vote = vote;
window.prevDeal = prevDeal;
window.nextDeal = nextDeal;
window.resetStack = resetStack;

if (sessionStorage.getItem('pt-ops') === '1') unlock();
else paintDots();
</script>
</body>
</html>
