<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Deal Room — Property True</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" href="/assets/favicon.svg?v=t-simple-2" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#182033;--muted:#5b6577;--line:#d9e0ea;--blue:#2f6fed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif}
a{color:var(--blue);text-decoration:none}.hidden{display:none!important}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:.55rem .85rem;background:rgba(238,242,247,.96);border-bottom:1px solid var(--line)}
.brand{display:flex;gap:.4rem;align-items:center;font-weight:800;font-size:.75rem;letter-spacing:.05em;color:var(--ink)}.brand img{width:22px;height:22px}
.gate{min-height:calc(100dvh - 48px);display:flex;align-items:center;justify-content:center;padding:.75rem}
.box{width:min(360px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:1.1rem;text-align:center}
.box h1{margin:.2rem 0 .35rem;font-size:1.5rem}.box p{margin:0 0 .7rem;color:var(--muted);font-size:.92rem}
.dots{display:flex;justify-content:center;gap:.55rem;margin:0 0 .7rem}.dot{width:12px;height:12px;border-radius:50%;border:2px solid #c5d0e0}.dot.on{background:var(--blue);border-color:var(--blue)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;max-width:260px;margin:0 auto}.pad button{height:52px;border-radius:12px;border:1px solid var(--line);background:#f7f9fc;font-size:1.2rem;font-weight:800;cursor:pointer}.err{color:#c23b3b;min-height:1rem;margin-top:.45rem;font-weight:700}
.room{max-width:560px;margin:0 auto;padding:.55rem .75rem 7rem}
.banner{background:#e8f0ff;border:1px solid #c7daf8;border-radius:12px;padding:.65rem .75rem;margin-bottom:.65rem;font-size:.86rem;font-weight:700;color:#1e3a6e;line-height:1.35}
.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:.45rem}.meta h1{margin:0;font-size:1.05rem;font-weight:800}.meta span{color:var(--muted);font-size:.8rem;font-weight:700}
.tabs{display:flex;gap:.35rem;overflow:auto;margin-bottom:.55rem}.tab{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:.4rem .65rem;font-size:.78rem;font-weight:800;cursor:pointer}.tab.active{background:#e8f0ff;border-color:#c7daf8}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.hero{position:relative;height:150px;background:#d9e2ef}.hero img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:.55rem;top:.55rem;z-index:2;border-radius:999px;padding:.25rem .55rem;font-size:.7rem;font-weight:800;background:#fff4d6;color:#a67c00}
.badge.bad{background:#fdecec;color:#c23b3b}
.body{padding:.7rem .75rem}.price{margin:0;font-size:1.4rem;font-weight:800}.addr{margin:.1rem 0 .45rem;font-size:.95rem;font-weight:700}.addr small{display:block;color:var(--muted);font-size:.8rem}
.money{border:1px solid var(--line);border-radius:12px;background:#f7f9fc;padding:.65rem;margin:.5rem 0}.money h3{margin:0 0 .4rem;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.line{display:flex;justify-content:space-between;gap:.5rem;font-size:.84rem;font-weight:700;padding:.12rem 0}.line span{color:var(--muted);font-weight:600}
.cf{margin-top:.45rem;padding-top:.45rem;border-top:1px dashed var(--line);display:flex;justify-content:space-between;font-weight:800;color:#c23b3b}
.note,.why{font-size:.84rem;color:var(--muted);font-weight:600;line-height:1.35;margin:.4rem 0 0}
.stack{margin-top:.75rem;background:#fff;border:1px solid var(--line);border-radius:14px;padding:.7rem}.item{display:flex;justify-content:space-between;padding:.35rem 0;border-bottom:1px solid var(--line);font-size:.84rem}.empty{color:var(--muted)}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#fff;border-top:1px solid var(--line);padding:.6rem .75rem calc(.6rem + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.08)}
.sticky-inner{max-width:560px;margin:0 auto}.acts{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:.4rem;margin-bottom:.4rem}
.acts button,.nav button,.nav a{appearance:none;display:block;width:100%;border-radius:12px;padding:.9rem .3rem;font-weight:800;font-size:.95rem;text-align:center;cursor:pointer;touch-action:manipulation}
.acts button{border:0}.no{background:#fdecec;color:#c23b3b}.maybe{background:#fff4d6;color:#a67c00}.yes{background:#e7f8f1;color:#0f9f6e}
.nav{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:.35rem}.nav button,.nav a{border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;font-size:.8rem;padding:.55rem}
</style>
</head>
<body>
<div class="top"><a class="brand" href="/"><img src="/assets/pt-mark.svg?v=t-simple-2" alt="" /> PROPERTY TRUE</a><a href="/" style="color:var(--muted);font-weight:700;font-size:.78rem">Site</a></div>
<div id="gate" class="gate"><div class="box">
<div style="color:var(--blue);font-size:.7rem;font-weight:800;letter-spacing:.12em">IE EXPANSION</div>
<h1>Deal Room</h1>
<p>Tap 3 1 2 1 · Outside OC multi hunt</p>
<div class="dots"><div class="dot" id="d0"></div><div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div></div>
<div class="pad">
<button type="button" onclick="press('1')">1</button><button type="button" onclick="press('2')">2</button><button type="button" onclick="press('3')">3</button>
<button type="button" onclick="press('4')">4</button><button type="button" onclick="press('5')">5</button><button type="button" onclick="press('6')">6</button>
<button type="button" onclick="press('7')">7</button><button type="button" onclick="press('8')">8</button><button type="button" onclick="press('9')">9</button>
<button type="button" onclick="press('clear')">Clear</button><button type="button" onclick="press('0')">0</button><button type="button" onclick="press('del')">Del</button>
</div><div class="err" id="err"></div></div></div>
<main id="room" class="room hidden">
<div class="meta"><h1>Deal Room</h1><span id="prog">1 / 3</span></div>
<div class="banner">Tinny money lane: find + underwrite deals. IE expansion loaded. Honest CF after vacancy + opex + PITI.</div>
<div class="tabs" id="tabs"></div>
<div id="mount"></div>
<div class="stack"><div style="font-weight:800;margin-bottom:.35rem">Your stack</div><div id="stackBody"><div class="empty">Empty</div></div>
<button type="button" onclick="resetStack()" style="width:100%;margin-top:.5rem;border:1px solid var(--line);background:#fff;border-radius:10px;padding:.55rem;font-weight:800">Reset</button></div>
</main>
<div id="sticky" class="sticky hidden"><div class="sticky-inner">
<div class="acts">
<button type="button" class="no" onclick="vote('no')">Pass</button>
<button type="button" class="maybe" onclick="vote('maybe')">Maybe</button>
<button type="button" class="yes" onclick="vote('yes')">Interested</button>
</div>
<div class="nav">
<button type="button" onclick="prevDeal()">Prev</button>
<button type="button" onclick="nextDeal()">Next</button>
<a id="listing" href="#" target="_blank" rel="noopener">Listing</a>
</div></div></div>
<script>
const PIN='3121'; let code=''; let idx=0; const KEY='pt-deal-stack-ie2';
const PLACEHOLDER='/assets/deal-placeholder.svg';

const DEALS=[
{id:'lime',address:'4308 Lime St',city:'Riverside, CA 92501',price:724995,beds:'4/3 multi',sqft:'2,546',link:'https://www.zillow.com/homedetails/4308-Lime-St-Riverside-CA-92501/17844634_zpid/',photo:'',rent:4000,rehab:40000,down:144999,loan:579996,pi:3957,tax_ins_mo:755,piti:4712,vac_opex:1720,cf:-2432,carry_months:2,rate:7.25,coc:-15.0,cash_in:194423,max_cf_price:295714,verdict:'STUDY - LONG DOM',why:'524 DOM = possible seller pain. Mid CF still about -$2.4K/mo at list after vac+opex+PITI. Only works if price crashes or rents much higher.'},
{id:'lincoln',address:'7563 Lincoln Ave',city:'Riverside, CA 92504',price:764900,beds:'5/4 multi',sqft:'1,681',link:'https://www.zillow.com/homedetails/7563-Lincoln-Ave-Riverside-CA-92504/17853736_zpid/',photo:'',rent:4200,rehab:25000,down:152980,loan:611920,pi:4174,tax_ins_mo:797,piti:4971,vac_opex:1806,cf:-2577,carry_months:1,rate:7.25,coc:-16.9,cash_in:182951,max_cf_price:316603,verdict:'STUDY - PRICE CUT',why:'Already cut $35K. Confirm duplex mix. Mid CF about -$2.6K/mo at list. Need real rent roll before any offer.'},
{id:'everest',address:'3928 Everest Ave',city:'Riverside, CA 92503',price:799995,beds:'4/2 multi',sqft:'1,324',link:'https://www.zillow.com/homedetails/3928-Everest-Ave-Riverside-CA-92503/17881160_zpid/',photo:'',rent:4000,rehab:20000,down:159999,loan:639996,pi:4366,tax_ins_mo:833,piti:5199,vac_opex:1720,cf:-2919,carry_months:1,rate:7.25,coc:-18.9,cash_in:185198,max_cf_price:295714,verdict:'PASS UNLESS CHEAP',why:'140 DOM. Weaker CF than Lime/Lincoln at list. Only revisit on hard discount + proven rents.'}
];

function money(n){if(n==null||isNaN(Number(n)))return '—'; n=Number(n); return (n<0?'-':'')+'$'+Math.round(Math.abs(n)).toLocaleString();}
function loadStack(){try{return JSON.parse(localStorage.getItem(KEY)||'{"yes":[],"no":[],"maybe":[]}')}catch(e){return{yes:[],no:[],maybe:[]}}}
function saveStack(s){localStorage.setItem(KEY,JSON.stringify(s));paintStack();}
function paintDots(){for(var i=0;i<4;i++)document.getElementById('d'+i).classList.toggle('on',i<code.length);}
function setErr(m){document.getElementById('err').textContent=m||'';}
function unlock(){sessionStorage.setItem('pt-ops','1');document.getElementById('gate').classList.add('hidden');document.getElementById('room').classList.remove('hidden');document.getElementById('sticky').classList.remove('hidden');paintAll();}
function tryPin(){if(code.length<4){setErr('Need 4 digits');return;} if(code===PIN)unlock(); else{setErr('Wrong PIN');code='';paintDots();}}
function press(k){setErr('');if(k==='clear'){code='';paintDots();return;} if(k==='del'){code=code.slice(0,-1);paintDots();return;} if(code.length>=4)return; code=code+String(k); paintDots(); if(code.length===4)setTimeout(tryPin,40);}
function paintTabs(){document.getElementById('tabs').innerHTML=DEALS.map(function(d,i){return '<button type="button" class="tab'+(i===idx?' active':'')+'" onclick="goDeal('+i+')">'+(i+1)+'. '+d.address.split(' ').slice(0,2).join(' ')+'</button>';}).join('');}
function goDeal(i){idx=i;paintAll();}
function paintCard(){
  var d=DEALS[idx];
  document.getElementById('prog').textContent=(idx+1)+' / '+DEALS.length;
  var src=(d.photo&&d.photo.trim())?d.photo:PLACEHOLDER;
  var cashIn=d.cash_in||((d.down||0)+(d.rehab||0)+((d.piti||0)*(d.carry_months||0)));
  document.getElementById('mount').innerHTML='<article class="card"><div class="hero"><div class="badge">'+d.verdict+'</div><img src="'+src+'" alt="" onerror="this.onerror=null;this.src=\''+PLACEHOLDER+'\';"/></div><div class="body">'+
    '<p class="price">'+money(d.price)+'</p>'+
    '<div class="addr">'+d.address+'<small>'+d.city+' · '+d.beds+' · '+d.sqft+' sf</small></div>'+
    '<div class="money"><h3>Deep money wrap (IE multi)</h3>'+
    '<div class="line"><span>20% down</span><b>'+money(d.down)+'</b></div>'+
    '<div class="line"><span>Loan</span><b>'+money(d.loan)+'</b></div>'+
    '<div class="line"><span>P&I @ '+d.rate+'%</span><b>'+money(d.pi)+'/mo</b></div>'+
    '<div class="line"><span>Tax+ins</span><b>'+money(d.tax_ins_mo)+'/mo</b></div>'+
    '<div class="line"><span>PITI</span><b>'+money(d.piti)+'/mo</b></div>'+
    '<div class="line"><span>Mid rent used</span><b>'+money(d.rent)+'/mo</b></div>'+
    '<div class="line"><span>Vac+opex rough</span><b>'+money(d.vac_opex)+'/mo</b></div>'+
    '<div class="line"><span>Rehab estimate</span><b>'+money(d.rehab)+'</b></div>'+
    '<div class="line"><span>Cash in rough</span><b>'+money(cashIn)+'</b></div>'+
    '<div class="line"><span>Cash-on-cash</span><b>'+d.coc+'%</b></div>'+
    '<div class="line"><span>Break-even buy</span><b>'+money(d.max_cf_price)+'</b></div>'+
    '<div class="cf"><span>Mid CF gut</span><span>'+money(d.cf)+'/mo</span></div>'+
    '<div class="note">CF = rent − vacancy − opex − PITI. Outside OC still needs discount or stronger rents to win.</div></div>'+
    '<p class="why">'+d.why+'</p></div></article>';
  document.getElementById('listing').href=d.link;
}
function paintStack(){
  var s=loadStack();
  function block(title,arr,kind){
    var h='<div style="font-weight:800;margin:.45rem 0 .2rem">'+title+'</div>';
    if(!arr.length) return h+'<div class="empty">Empty</div>';
    return h+arr.map(function(x){return '<div class="item"><div><b>'+x.address+'</b><div style="color:var(--muted)">'+money(x.price)+' · '+kind+'</div></div><a href="'+x.link+'" target="_blank" rel="noopener">View</a></div>';}).join('');
  }
  document.getElementById('stackBody').innerHTML=block('Interested',s.yes||[],'yes')+block('Maybe',s.maybe||[],'maybe')+block('Passed',s.no||[],'pass');
}
function paintAll(){paintTabs();paintCard();paintStack();}
function vote(kind){var d=DEALS[idx]; var s=loadStack(); ['yes','no','maybe'].forEach(function(k){s[k]=(s[k]||[]).filter(function(x){return x.id!==d.id;});}); s[kind].unshift({id:d.id,address:d.address,price:d.price,link:d.link}); saveStack(s); paintAll(); alert(kind==='yes'?'Saved to Interested':(kind==='maybe'?'Saved to Maybe':'Saved to Passed'));}
function prevDeal(){idx=(idx-1+DEALS.length)%DEALS.length;paintAll();}
function nextDeal(){idx=(idx+1)%DEALS.length;paintAll();}
function resetStack(){localStorage.removeItem(KEY);paintAll();}
window.press=press;window.vote=vote;window.prevDeal=prevDeal;window.nextDeal=nextDeal;window.resetStack=resetStack;window.goDeal=goDeal;
if(sessionStorage.getItem('pt-ops')==='1') unlock(); else paintDots();
</script>
</body></html>
