<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Deal Room — Property True</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="canonical" href="https://propertytrue.com/deals/" />
<link rel="icon" href="/assets/favicon.svg?v=t-simple-2" type="image/svg+xml" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#182033;--muted:#5b6577;--line:#d9e0ea;--blue:#2f6fed;--good:#0f9f6e;--warn:#a67c00;--bad:#c23b3b;--goodbg:#e7f8f1;--warnbg:#fff4d6;--badbg:#fdecec}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif}
a{color:var(--blue);text-decoration:none}.hidden{display:none!important}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:.55rem .85rem;background:rgba(238,242,247,.96);border-bottom:1px solid var(--line)}
.brand{display:flex;gap:.4rem;align-items:center;font-weight:800;font-size:.75rem;letter-spacing:.05em;color:var(--ink)}.brand img{width:22px;height:22px}.toplink{font-size:.78rem;font-weight:700;color:var(--muted)}
.gate{min-height:calc(100dvh - 48px);display:flex;align-items:center;justify-content:center;padding:.75rem}
.box{width:min(360px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:1.1rem;text-align:center}
.box h1{margin:.2rem 0 .35rem;font-size:1.5rem}.box p{margin:0 0 .7rem;color:var(--muted);font-size:.92rem}
.dots{display:flex;justify-content:center;gap:.55rem;margin:0 0 .7rem}.dot{width:12px;height:12px;border-radius:50%;border:2px solid #c5d0e0}.dot.on{background:var(--blue);border-color:var(--blue)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;max-width:260px;margin:0 auto}.pad button{height:52px;border-radius:12px;border:1px solid var(--line);background:#f7f9fc;font-size:1.2rem;font-weight:800;cursor:pointer}.pad .soft{font-size:.85rem;color:var(--muted)}.err{color:var(--bad);min-height:1rem;margin-top:.45rem;font-weight:700;font-size:.85rem}
.room{max-width:560px;margin:0 auto;padding:.55rem .75rem 6.4rem}
.banner{background:#fff4d6;border:1px solid #f0d58a;border-radius:12px;padding:.65rem .75rem;margin-bottom:.65rem;font-size:.86rem;font-weight:700;color:#7a5a00;line-height:1.35}
.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:.45rem}.meta h1{margin:0;font-size:1.05rem;font-weight:800}.meta span{color:var(--muted);font-size:.8rem;font-weight:700}
.tabs{display:flex;gap:.35rem;overflow:auto;margin-bottom:.55rem}.tab{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:.4rem .65rem;font-size:.78rem;font-weight:800;cursor:pointer}.tab.active{background:#e8f0ff;border-color:#c7daf8}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.hero{position:relative;height:150px;background:#d9e2ef}.hero img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:.55rem;top:.55rem;z-index:2;border-radius:999px;padding:.25rem .55rem;font-size:.7rem;font-weight:800;background:#fdecec;color:#c23b3b}
.body{padding:.7rem .75rem}.price{margin:0;font-size:1.4rem;font-weight:800}.addr{margin:.1rem 0 .45rem;font-size:.95rem;font-weight:700}.addr small{display:block;color:var(--muted);font-size:.8rem}
.money{border:1px solid var(--line);border-radius:12px;background:#f7f9fc;padding:.65rem;margin:.5rem 0}.money h3{margin:0 0 .4rem;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.line{display:flex;justify-content:space-between;gap:.5rem;font-size:.84rem;font-weight:700;padding:.12rem 0}.line span{color:var(--muted);font-weight:600}
.cf{margin-top:.45rem;padding-top:.45rem;border-top:1px dashed var(--line);display:flex;justify-content:space-between;font-weight:800}.cf.neg{color:var(--bad)}.cf.pos{color:var(--good)}
.note{font-size:.8rem;color:var(--muted);font-weight:600;line-height:1.35;margin:.4rem 0 0}.why{margin:.5rem 0 0;font-size:.86rem;color:var(--muted);font-weight:600;line-height:1.35}
.empty-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:1rem}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:.55rem .75rem calc(.55rem + env(safe-area-inset-bottom))}
.sticky-inner{max-width:560px;margin:0 auto}.acts{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:.4rem}.acts button{border:0;border-radius:12px;padding:.85rem .3rem;font-weight:800;cursor:pointer;font-size:.95rem}
.no{background:#fdecec;color:var(--bad)}.maybe{background:#fff4d6;color:var(--warn)}.yes{background:#e7f8f1;color:var(--good)}
.nav{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:.35rem;margin-top:.4rem}.nav button,.nav a{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:.55rem;font-weight:800;font-size:.8rem;text-align:center;cursor:pointer}
.stack{margin-top:.75rem;background:#fff;border:1px solid var(--line);border-radius:14px;padding:.7rem}.stack summary{font-weight:800;cursor:pointer}.item{display:flex;justify-content:space-between;padding:.35rem 0;border-bottom:1px solid var(--line);font-size:.84rem}.empty{color:var(--muted)}
</style>
</head>
<body>
<div class="top"><a class="brand" href="/"><img src="/assets/pt-mark.svg?v=t-simple-2" alt="" /> PROPERTY TRUE</a><a class="toplink" href="/">Site</a></div>
<div id="gate" class="gate"><div class="box">
<div style="color:var(--blue);font-size:.7rem;font-weight:800;letter-spacing:.12em">DEAL ROOM</div>
<h1>Deal Room</h1>
<p>Tap PIN. Then use Pass / Maybe / Interested.</p>
<div class="dots"><div class="dot" id="d0"></div><div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div></div>
<div class="pad" id="pad">
<button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
<button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
<button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
<button type="button" class="soft" data-k="clear">Clear</button><button type="button" data-k="0">0</button><button type="button" class="soft" data-k="del">Del</button>
</div><div class="err" id="err"></div></div></div>
<main id="room" class="room hidden">
<div class="meta"><h1>Deal Room</h1><span id="prog"></span></div>
<div class="banner">Main St is marked PASS until rehab bid is real. Destroyed condition is now shown in money wrap.</div>
<div class="tabs" id="tabs"></div>
<div id="mount"></div>
<details class="stack" open><summary>Your stack</summary><div id="stackBody"></div>
<button type="button" id="resetBtn" style="width:100%;margin-top:.5rem;border:1px solid var(--line);background:#fff;border-radius:10px;padding:.55rem;font-weight:800;cursor:pointer">Reset</button>
</details></main>
<div id="sticky" class="sticky hidden"><div class="sticky-inner">
<div class="acts">
<button class="no" type="button" id="btnNo">Pass</button>
<button class="maybe" type="button" id="btnMaybe">Maybe</button>
<button class="yes" type="button" id="btnYes">Interested</button>
</div>
<div class="nav">
<button type="button" id="prev">Prev</button>
<button type="button" id="next">Next</button>
<a id="listing" href="#" target="_blank" rel="noopener">Listing</a>
</div></div></div>
<script src="/deals/app.js?v=4"></script>
</body>
</html>
