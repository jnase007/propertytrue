<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Deal Room</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="icon" href="/assets/favicon.svg?v=t-simple-2" type="image/svg+xml"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/deals/room.css?v=tem2"/>
</head>
<body>
<div class="top"><a class="brand" href="/"><img src="/assets/pt-mark.svg?v=t-simple-2" alt=""/> PROPERTY TRUE</a><a class="site" href="/">Site</a></div>
<div id="gate" class="gate"><div class="box">
<div class="kicker">TEMECULA AREA · ROI</div>
<h1>Deal Room</h1>
<p>Tap <b>3 1 2 1</b></p>
<div class="dots"><div class="dot" id="d0"></div><div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div></div>
<div class="pad">
<button type="button" onclick="press('1')">1</button><button type="button" onclick="press('2')">2</button><button type="button" onclick="press('3')">3</button>
<button type="button" onclick="press('4')">4</button><button type="button" onclick="press('5')">5</button><button type="button" onclick="press('6')">6</button>
<button type="button" onclick="press('7')">7</button><button type="button" onclick="press('8')">8</button><button type="button" onclick="press('9')">9</button>
<button type="button" onclick="press('clear')">Clear</button><button type="button" onclick="press('0')">0</button><button type="button" onclick="press('del')">Del</button>
</div><div class="err" id="err"></div></div></div>
<main id="room" class="room hidden">
<div class="meta"><h1>Deal Room</h1><span id="prog">1 / 3</span></div>
<div class="banner">Temecula corridor. Big <b>Open in Maps</b> + <b>Open Listing</b> on every card. Full ROI.</div>
<div class="tabs" id="tabs"></div>
<div id="mount"></div>
<div class="stack"><div class="stack-title">Your stack</div><div id="stackBody"><div class="empty">Empty</div></div>
<button type="button" class="reset" onclick="resetStack()">Reset</button></div>
</main>
<div id="sticky" class="sticky hidden"><div class="sticky-inner">
<div class="acts">
<button type="button" class="no" onclick="vote('no')">Pass</button>
<button type="button" class="maybe" onclick="vote('maybe')">Maybe</button>
<button type="button" class="yes" onclick="vote('yes')">Interested</button>
</div>
<div class="nav">
<button type="button" onclick="prevDeal()">Prev</button>
<button type="button" onclick="nextDeal()">Next</button>
</div></div></div>
<script src="/deals/app.js?v=tem2"></script>
</body>
</html>
